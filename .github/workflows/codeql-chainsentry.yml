name: chainsentry + SARIF upload

# Demonstrates chainsentry running on the chain itself (so detection
# regressions are caught in CI), AND uploads the SARIF output to GitHub
# Code Scanning for inline review on PRs.
#
# Note: chainsentry's own source is Python, so we're scanning the bundled
# vulnerable.sol fixtures for regression checks, not the Python source.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write   # required for `actions/upload-sarif`

jobs:
  chainsentry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run chainsentry on vulnerable.sol fixtures
        run: |
          python3 -m chainsentry contracts/ -f sarif -o chainsentry.sarif
          # Sanity: at least one HIGH finding must exist (regression check).
          python3 -m chainsentry contracts/ --fail-on high

      - name: Upload chainsentry SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: chainsentry.sarif
          category: chainsentry
